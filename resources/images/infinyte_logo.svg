<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52" fill="none">
  <defs>
    <!-- Vibrant modern tech gradients -->
    <linearGradient id="infGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="infGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="infGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <!-- Subtle drop shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ================= INFINITY ICON ================= -->
  <g transform="translate(6, 6)" filter="url(#logoShadow)">
    <!-- Dynamic Infinity Symbol Ribbon -->
    <!-- Left Loop -->
    <path d="M 20 20 C 13 10, 4 11, 4 20 C 4 29, 13 30, 20 20 Z" 
          stroke="url(#infGradLeft)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Center Crossing & Right Loop -->
    <path d="M 20 20 C 27 30, 36 29, 36 20 C 36 11, 27 10, 20 20 Z" 
          stroke="url(#infGradRight)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Glowing overlap node -->
    <circle cx="20" cy="20" r="2.8" fill="#ffffff" />
    <circle cx="20" cy="20" r="1.8" fill="#2563eb" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(54, 34)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="28" 
          font-weight="800" 
          letter-spacing="-0.8px" 
          fill="#0f172a">
      infin<tspan fill="#2563eb">y</tspan>te
    </text>
  </g>
</svg>

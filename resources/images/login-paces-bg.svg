<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- White dot pattern for capsule fills -->
    <pattern id="dotPattern" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="2.2" fill="#ffffff" opacity="0.85" />
    </pattern>

    <!-- Gradient for Top-Right decorative pills -->
    <linearGradient id="gradTR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.42" />
    </linearGradient>

    <!-- Gradient for Bottom-Left decorative pills -->
    <linearGradient id="gradBL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.42" />
    </linearGradient>

    <!-- Soft glow blur -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean, bright modern canvas background -->
  <rect width="1920" height="1080" fill="#f8fafc" />

  <!-- Subtle ambient radial glows -->
  <circle cx="1650" cy="250" r="450" fill="#e0e7ff" opacity="0.5" filter="url(#softGlow)" />
  <circle cx="250" cy="850" r="450" fill="#fce7f3" opacity="0.45" filter="url(#softGlow)" />

  <!-- ================= TOP-RIGHT DECORATIVE COMPOSITION ================= -->
  <g transform="translate(1620, 220) rotate(45)">
    <!-- Main Long Capsule -->
    <g>
      <rect x="-80" y="-320" width="160" height="640" rx="80" ry="80" fill="url(#gradTR)" />
      <rect x="-80" y="-320" width="160" height="640" rx="80" ry="80" fill="url(#dotPattern)" />
    </g>

    <!-- Secondary Adjacent Capsule -->
    <g transform="translate(140, -60)">
      <rect x="-55" y="-220" width="110" height="440" rx="55" ry="55" fill="url(#gradTR)" opacity="0.8" />
      <rect x="-55" y="-220" width="110" height="440" rx="55" ry="55" fill="url(#dotPattern)" />
    </g>

    <!-- Third Small Capsule -->
    <g transform="translate(-130, 80)">
      <rect x="-45" y="-160" width="90" height="320" rx="45" ry="45" fill="url(#gradTR)" opacity="0.65" />
      <rect x="-45" y="-160" width="90" height="320" rx="45" ry="45" fill="url(#dotPattern)" />
    </g>

    <!-- Floating Orb/Circle -->
    <g transform="translate(-160, -180)">
      <circle cx="0" cy="0" r="42" fill="url(#gradTR)" opacity="0.85" />
      <circle cx="0" cy="0" r="42" fill="url(#dotPattern)" />
    </g>
    <circle cx="160" cy="220" r="24" fill="#38bdf8" opacity="0.35" />
  </g>

  <!-- ================= BOTTOM-LEFT DECORATIVE COMPOSITION ================= -->
  <g transform="translate(260, 840) rotate(45)">
    <!-- Main Long Capsule -->
    <g>
      <rect x="-85" y="-340" width="170" height="680" rx="85" ry="85" fill="url(#gradBL)" />
      <rect x="-85" y="-340" width="170" height="680" rx="85" ry="85" fill="url(#dotPattern)" />
    </g>

    <!-- Secondary Adjacent Capsule -->
    <g transform="translate(-140, 60)">
      <rect x="-55" y="-220" width="110" height="440" rx="55" ry="55" fill="url(#gradBL)" opacity="0.8" />
      <rect x="-55" y="-220" width="110" height="440" rx="55" ry="55" fill="url(#dotPattern)" />
    </g>

    <!-- Third Small Capsule -->
    <g transform="translate(130, -70)">
      <rect x="-45" y="-160" width="90" height="320" rx="45" ry="45" fill="url(#gradBL)" opacity="0.7" />
      <rect x="-45" y="-160" width="90" height="320" rx="45" ry="45" fill="url(#dotPattern)" />
    </g>

    <!-- Floating Orb/Circle -->
    <g transform="translate(170, 160)">
      <circle cx="0" cy="0" r="46" fill="url(#gradBL)" opacity="0.85" />
      <circle cx="0" cy="0" r="46" fill="url(#dotPattern)" />
    </g>
    <circle cx="-160" cy="-200" r="26" fill="#f472b6" opacity="0.35" />
  </g>
</svg>

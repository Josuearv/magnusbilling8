<!DOCTYPE HTML>
<html manifest="">

<head>
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport" />
    <link href="resources/images/logo.ico" id="favicon" rel="shortcut icon" type="image/x-icon" />
    <title>
        MagnusBilling
    </title>

    <script type="text/javascript">
        // Surface boot failures before ExtJS exists, including dependency load errors.
        (function () {
            var done = false, failure = null;
            function render() {
                var message = document.getElementById('loading-msg');
                if (!message || !failure || done) return;
                var text = 'Unable to start MagnusBilling. Reload the page or contact the administrator.';
                message.textContent = (typeof t === 'function' ? t(text) : text) + ' [' + failure + ']';
                message.setAttribute('role', 'alert');
                message.style.color = '#ffb4b4';
                message.style.whiteSpace = 'normal';
            }
            var timer = setTimeout(function () { window.MBillingBoot.fail('BOOT_TIMEOUT'); }, 120000);
            window.MBillingBoot = {
                fail: function (code) {
                    if (done || failure) return;
                    failure = code;
                    clearTimeout(timer);
                    render();
                },
                complete: function () { done = true; clearTimeout(timer); },
                getFailure: function () { return failure; }
            };
            window.addEventListener('error', function (event) {
                var target = event.target;
                var source = target && (target.src || target.href) || event.filename;
                if (!source || source.indexOf(location.origin + '/') !== 0) return;
                if (target !== window && target.tagName !== 'SCRIPT' && target.tagName !== 'LINK') return;
                window.MBillingBoot.fail('BOOT_SCRIPT: ' + source.split('?')[0].substring(location.origin.length));
            }, true);
            document.addEventListener('DOMContentLoaded', render);
        }());

        // 1. Purge obsolete ExtJS Microloader localStorage cache to prevent loading stale 2019 bundle manifests
        try {
            if (window.localStorage) {
                var keysToPurge = [];
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (k && (k.indexOf('_ext') === 0 || k.indexOf('manifest') !== -1 || k.indexOf('MBilling') !== -1 || k.indexOf('black-') !== -1 || k.indexOf('blue-') !== -1)) {
                        keysToPurge.push(k);
                    }
                }
                for (var j = 0; j < keysToPurge.length; j++) {
                    localStorage.removeItem(keysToPurge[j]);
                }
            }
        } catch (e) {}

        // 2. Polyfill crypto.randomUUID for non-secure HTTP contexts to prevent client extensions from breaking
        if (!window.crypto) {
            window.crypto = {};
        }
        if (!window.crypto.randomUUID) {
            window.crypto.randomUUID = function () {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                    var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            };
        }
    </script>

    <script src="index.php?v=8.0.0.17"></script>
    <script src="locale.js?v=8.0.0.17"></script>
    <script src="icons.js?v=8.0.0.17"></script>

    <link href="resources/MBilling-all.css?v=8.0.0.17" rel="stylesheet" />
    <link href="resources/init.css?v=8.0.0.17" rel="stylesheet" />
    <script>
        if (window.agentTitle) {
            window.show_signup_button = false;
            window.document.title = window.agentTitle;
        }

        if (window.reCaptchaKey && window.reCaptchaKey.length > 15) {
            document.write('<script async="" defer="" src="https://www.google.com/recaptcha/api.js?render=' + window.reCaptchaKey + '"> <\/script>');
        }
    </script>
</head>

<body>
    <div id="loading-mask"></div>
    <div id="loading">
        <div class="loading-indicator">
            <div style="text-align:center">
                <img id="loadinggif" src="resources/images/loading.gif" style="vertical-align:top;" width="90px" />
                <br />
                <span id="name-system"></span>
                <br />
                <span id="text-msg"></span>
                <br />
                <span id="loading-msg"></span>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        if (window.agentTitle) {
            document.getElementById('loadinggif').src = 'resources/images/logo_custom_' + window.agentId + '.png';
        }

        document.getElementById('loading-mask').style.backgroundColor = window.backgroundColor || '#1b1e23';
        window.theme = window.theme || 'black-neptune';
        window.themeApp = window.theme;
        window.theme_color = window.theme_color || 'black';
        window.isThemeNeptune = window.theme.indexOf('neptune') !== -1;
        window.isThemeCrisp = window.theme.indexOf('crisp') !== -1;
        window.isThemeTriton = window.theme.indexOf('triton') !== -1;
        window.isThemeDark = window.theme.indexOf('dark') !== -1;
        window.layout = typeof window.layout !== 'undefined' ? window.layout : 1;
    </script>

    <script type="text/javascript">
        if (window.agentTitle) {
            document.getElementById('name-system').innerHTML = window.agentTitle;
        } else {
            document.getElementById('name-system').innerHTML = typeof t === 'function' ? t('MagnusBilling System') : 'MagnusBilling System';
        }

        document.getElementById('text-msg').innerHTML = 'Voip System';
        document.getElementById('loading-msg').innerHTML = typeof t === 'function' ? t('Starting...') : 'Starting...';
    </script>

    <script type="text/javascript">
        var defaultLang = localStorage.getItem('lang') && localStorage.getItem('lang') != 'undefined'
            ? localStorage.getItem('lang')
            : (localStorage.lang = window.lang || 'en');

        var lang = defaultLang,
            localeApp = 'resources/locale/' + lang + '.js';
        document.write('<script type="text/javaScript" src="resources/help/help_' + lang + '.js"></' + 'script>');
        document.write('<script type="text/javaScript" src="' + localeApp + '"></' + 'script>');
    </script>

    <script type="text/javascript">
        var Ext = Ext || {}; // Ext namespace won't be defined yet...
        Ext.repoDevMode = true;
        window.wallpaper = window.wallpaper || 'Azul';
        window.wallpapers = 'resources/images/wallpapers/' + window.wallpaper + '.jpg';
        window.colorMenu = window.colorMenu || '';

        Ext.beforeLoad = function (tags) {
            window.isTablet = !tags.desktop;
            var theme = window.isTablet ? (window.theme_color || 'black') + '-triton' : window.theme;

            Ext.microloaderTags = tags;
            Ext.Boot.platformTags = Ext.platformTags || {};

            Ext.manifest = theme; // this name must match a build profile name
        };
    </script>

    <script data-app="69eb1359-905e-4f4c-9e1e-2841e3ec1bda" id="microloader" src="bootstrap.js?v=8.0.0.17" type="text/javascript"></script>
</body>
</html>
